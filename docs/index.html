<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zigdom — A Zig WebAssembly DOM utility library demo featuring canvas drawing primitives and interactive physics simulation." />
    <script src="zigdom.js"></script>
    <title>Zigdom Demo</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1 id="title">Zigdom — The Demo</h1>
    </header>
    <nav>
      <div id="controls">
        <button id="addSomethingButton" type="button">Add Something</button>
        <button id="clearAsideButton" type="button">Clear Aside</button>
        <button id="refreshButton" type="button">Refresh Main Canvas</button>
        <button id="drumPlayButton" type="button" onclick="playClickSound()">▶ Drum Machine</button>
        <button id="audioToggleButton" type="button" onclick="toggleAudio()">🔇 Play Soundtrack</button>
        <div class="volume-control">
          <span id="volumeLabel">Vol: 20%</span>
          <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.2" oninput="changeVolume(this.value)" />
        </div>
      </div>
    </nav>
    <hr />
    <section>
      <div id="loading">Loading ...</div>
      <div id="application" class="application"></div>
    </section>

    <!-- Canvas One: static synthwave gallery -->
    <div id="canvasOneDiv" class="canvas-container" title="Synthwave Gallery — click Refresh to redraw"></div>

    <!-- Canvas Two: interactive ball physics -->
    <div id="canvasTwoDiv" class="canvas-container canvas-interactive" title="Click or tap to push the balls!">
      <div class="canvas-hint">Click or tap to push the balls!</div>
    </div>

    <!-- Canvas Three: retro drum machine -->
    <div id="canvasThreeDiv" class="canvas-container canvas-drum" title="Click pads to toggle · Play/Stop to run">
      <div class="canvas-hint">Click pads to toggle · Play/Stop to run</div>
    </div>

    <hr />
    <footer id="information">
      <p>
        Zigdom is a utility library for my Web and Web Assembly (WASM) projects.
      </p>
      <p>
        Source code:
        <a href="https://github.com/ewaldhorn/zigdom">
            https://github.com/ewaldhorn/zigdom
        </a>
      </p>
    </footer>
    <script type="module" defer>
      "use strict";

      ZigDom.instantiate("zigdom.wasm").catch(function (err) {
        console.error("Zigdom failed to load:", err);
        document.getElementById("loading").innerText = "Failed to load WASM: " + err.message;
      });
    </script>
  </body>
</html>
